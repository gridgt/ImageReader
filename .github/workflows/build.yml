name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      # Патчи к сабмодулям xland/TinyOCR и xland/Ling:
      #   - toolset v145 -> v143 (runners имеют только VS2022/v143)
      #   - include/библиотечные пути через MSBuild-свойства (локально динамика,
      #     CI передаёт статику /p:...)
      #   - фикс lambda [chars] в Ling/include/Util.h
      - name: Apply patches to submodules
        shell: pwsh
        run: |
          git -C third_party/TinyOCR apply --verbose "$env:GITHUB_WORKSPACE/ci/patches/tinyocr.patch"
          git -C third_party/Ling apply --verbose "$env:GITHUB_WORKSPACE/ci/patches/ling.patch"

      # ---- onnxruntime (статик, /MT) из исходников ----
      - name: Setup Python (для onnxruntime build.py)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # vcvars64: на windows-latest CMake не находит VS через vswhere
      # (runner-сервис), поэтому загружаем dev-окружение явно.
      # Пин на VS2022: единый тулсет v143/14.44 (все проекты и onnxruntime),
      # а не VS2026/v145 — избегаем несовместимости ABI и строгости 14.51.
      - name: Load MSVC dev environment (VS2022)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vs-install: C:\Program Files\Microsoft Visual Studio\2022\Enterprise

      - name: Cache onnxruntime static
        id: cache-ort
        uses: actions/cache@v5
        with:
          path: third_party/onnxruntime-static
          key: onnxruntime-static-1.23.2-vs2022-v2

      - name: Build onnxruntime static
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --branch v1.23.2 --single-branch https://github.com/microsoft/onnxruntime.git onnxruntime-src
          # --target onnxruntime: собираем только саму статическую библиотеку
          # (без тестовых exe) — детерминированный вывод onnxruntime.lib.
          python onnxruntime-src/tools/ci_build/build.py --config Release --build_dir ort-build --skip_tests --cmake_generator Ninja --enable_msvc_static_runtime --compile_no_warning_as_error --target onnxruntime --parallel
          New-Item -ItemType Directory -Force third_party/onnxruntime-static/include, third_party/onnxruntime-static/lib | Out-Null
          Copy-Item onnxruntime-src/include/onnxruntime/*.h third_party/onnxruntime-static/include/ -Force
          $cfg = Get-ChildItem -Recurse ort-build -Filter onnxruntime_config.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cfg) { Copy-Item $cfg.FullName third_party/onnxruntime-static/include/ }
          $lib = Get-ChildItem -Recurse ort-build -Filter "onnxruntime.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lib) {
            $found = Get-ChildItem -Recurse ort-build -Filter "*.lib" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'ort-build[\\/]Release' -and $_.Name -notmatch 'gtest|gmock' } |
              Select-Object -First 20
            throw "onnxruntime.lib not found in ort-build. Candidates: $($found.Name -join '; ')"
          }
          Copy-Item $lib.FullName third_party/onnxruntime-static/lib/

      # ---- OpenCV (статик, core+imgproc, /MT) из исходников ----
      - name: Cache opencv static
        id: cache-cv
        uses: actions/cache@v5
        with:
          path: third_party/opencv-static
          key: opencv-static-4.14.0-msvc2022

      - name: Build opencv static
        if: steps.cache-cv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/archive/refs/tags/4.14.0.tar.gz" -OutFile opencv.tar.gz
          tar -xzf opencv.tar.gz
          cmake -S opencv-4.14.0 -B opencv-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_LIST=core,imgproc -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF `
            -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF `
            -DBUILD_opencv_python_bindings_generator=OFF -DBUILD_opencv_java_bindings_generator=OFF `
            -DWITH_IPP=OFF -DWITH_OPENCL=OFF -DWITH_LAPACK=OFF -DWITH_EIGEN=OFF `
            -DWITH_ZLIB=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF `
            -DWITH_ITT=OFF -DWITH_OPENMP=OFF -DWITH_PROTOBUF=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/third_party/opencv-static"
          cmake --build opencv-build --config Release --parallel 4
          cmake --install opencv-build --config Release
          if (-not (Test-Path third_party/opencv-static/lib/opencv_core4140.lib)) { throw "opencv_core4140.lib not found" }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Clipper2
        shell: pwsh
        run: msbuild third_party/TinyOCR/Clipper2/Clipper2.vcxproj /m /nologo /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=${{ github.workspace }}\third_party\TinyOCR\"

      - name: Build TinyOCR
        shell: pwsh
        run: msbuild third_party/TinyOCR/TinyOCR/TinyOCR.vcxproj /m /nologo /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=${{ github.workspace }}\third_party\TinyOCR\" "/p:OpenCVIncDir=opencv-static\include" "/p:OrtIncDir=onnxruntime-static\include"

      - name: Build yoga
        shell: pwsh
        run: msbuild third_party/Ling/yoga/yoga.vcxproj /m /nologo /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=${{ github.workspace }}\third_party\Ling\"

      - name: Build Ling
        shell: pwsh
        run: msbuild third_party/Ling/Ling.vcxproj /m /nologo /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=${{ github.workspace }}\third_party\Ling\"

      - name: Build ImageReader (static link)
        shell: pwsh
        run: msbuild ImageReader/ImageReader.vcxproj /m /nologo /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=${{ github.workspace }}\" "/p:OrtSdkDir=onnxruntime-static" "/p:OpenCVLibDir=opencv-static\lib" "/p:OpenCVLibs=opencv_core4140.lib;opencv_imgproc4140.lib"

      - name: Upload artifact (single exe)
        uses: actions/upload-artifact@v5
        with:
          name: ImageReader-windows-x64-static
          path: x64/Release/ImageReader.exe
